<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小Y日历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{
    --theme:#e8615a;          /* 由 JS 覆盖 */
    --paper:#f4f3ef;
    --ink:#1f1d1b;
    --muted:#77736c;
    --line:#2a2724;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Patrick Hand","ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-family:"ZCOOL KuaiLe",sans-serif;font-size:28px;letter-spacing:1px}
  .brand b{color:var(--theme)}
  .nav{display:flex;align-items:center;gap:10px}
  .nav h2{margin:0;font-size:26px;min-width:150px;text-align:center;font-weight:400}
  .btn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px 12px 9px 13px;padding:4px 12px;font:inherit;font-size:18px;cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--theme);color:#fff;border-color:var(--line)}

  .themes{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
  .themes span{color:var(--muted);font-size:17px;margin-right:2px}
  .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
  .dot[aria-pressed="true"]{outline:3px solid var(--line);outline-offset:2px}

  /* 手绘感网格 */
  .cal{
    border:2.5px solid var(--line);
    border-radius:6px 10px 5px 9px;
    background:var(--paper);
    overflow:hidden;
  }
  .row{display:grid;grid-template-columns:repeat(7,1fr)}
  .head div{
    text-align:center;font-size:26px;padding:6px 0;
    border-bottom:2.5px solid var(--line);
    border-right:2px solid var(--line);
  }
  .head div:last-child{border-right:none}
  .cell{
    position:relative;min-height:96px;padding:6px 8px;
    border-right:2px solid var(--line);border-bottom:2px solid var(--line);
    cursor:pointer;background:transparent;transition:background .15s;
    text-align:left;font:inherit;color:inherit;border-top:none;border-left:none;
  }
  .row .cell:nth-child(7n){border-right:none}
  .cal .row:last-child .cell{border-bottom:none}
  .cell .num{font-size:22px;line-height:1}
  .cell.empty{cursor:default}
  .cell.has{background:color-mix(in srgb,var(--theme) 38%,transparent)}
  .cell.today .num{
    display:inline-block;border:2px solid var(--line);border-radius:50%;
    padding:3px 6px;margin:-5px 0 0 -6px;
  }
  .cell .count{
    position:absolute;right:8px;bottom:6px;
    font-size:15px;color:var(--ink);
    background:rgba(255,255,255,.75);border:1.5px solid var(--line);
    border-radius:999px;padding:0 8px;
  }
  .cell:not(.empty):hover{background:color-mix(in srgb,var(--theme) 14%,transparent)}
  .cell.has:hover{background:color-mix(in srgb,var(--theme) 50%,transparent)}

  .remind{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:17px}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(20,18,16,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .mask.show{display:flex}
  .sheet{
    width:100%;max-width:440px;max-height:86vh;overflow:auto;
    background:var(--card);border:2.5px solid var(--line);border-radius:10px 14px 9px 12px;
    padding:16px 18px 18px;box-shadow:6px 6px 0 color-mix(in srgb,var(--theme) 55%,transparent);
  }
  .sheet h3{margin:0 0 4px;font-size:26px;font-weight:400}
  .sheet .sub{color:var(--muted);margin-bottom:12px}
  .list{list-style:none;padding:0;margin:0 0 12px}
  .list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1.5px dashed #c9c5bd;font-size:19px}
  .list li.done .txt{text-decoration:line-through;color:var(--muted)}
  .list .txt{flex:1;word-break:break-word}
  .list input[type=checkbox]{width:20px;height:20px;accent-color:var(--theme)}
  .del{border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .emptytip{color:var(--muted);padding:6px 0 12px}
  .add{display:flex;gap:8px}
  .add input{
    flex:1;min-width:0;font:inherit;font-size:19px;padding:6px 10px;
    border:2px solid var(--line);border-radius:9px 11px 8px 12px;background:var(--paper);color:var(--ink)
  }
  .close{float:right;margin-top:-4px}

  .toast{
    position:fixed;left:50%;top:16px;transform:translateX(-50%);
    background:var(--card);border:2.5px solid var(--line);border-left:10px solid var(--theme);
    border-radius:10px;padding:10px 16px;font-size:18px;z-index:20;display:none;max-width:calc(100% - 32px)
  }
  .toast.show{display:block}

  @media (max-width:600px){
    .head div{font-size:18px}
    .cell{min-height:64px;padding:4px 5px}
    .cell .num{font-size:17px}
    .cell .count{font-size:12px;padding:0 5px;right:3px;bottom:3px}
    .nav h2{font-size:21px;min-width:110px}
    .brand{font-size:23px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>小Y</b>日历</div>
    <div class="nav">
      <button class="btn" id="prev" aria-label="上个月">‹</button>
      <h2 id="title"></h2>
      <button class="btn" id="next" aria-label="下个月">›</button>
      <button class="btn" id="todayBtn">今天</button>
    </div>
  </header>

  <div class="themes" id="themes"><span>主题色</span></div>

  <div class="cal" id="cal">
    <div class="row head">
      <div>S</div><div>Mon</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div id="grid"></div>
  </div>

  <div class="remind">
    <span id="remindStatus">提醒：每天 8:00 和 12:00 提醒当天待办</span>
    <button class="btn" id="enableNotify">开启通知</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="btn close" id="closeBtn" aria-label="关闭">×</button>
    <h3 id="dayTitle"></h3>
    <div class="sub" id="daySub"></div>
    <ul class="list" id="list"></ul>
    <form class="add" id="addForm">
      <input id="addInput" placeholder="写一件要做的事…" autocomplete="off">
      <button class="btn primary" type="submit">添加</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const THEMES = [
  {name:'珊瑚红', c:'#e8615a'},
  {name:'橘子橙', c:'#f29a3a'},
  {name:'柠檬黄', c:'#e9c43b'},
  {name:'薄荷绿', c:'#5cb88a'},
  {name:'天空蓝', c:'#4f9ad8'},
  {name:'葡萄紫', c:'#8f6cd1'},
  {name:'樱花粉', c:'#ec7fb0'},
];
const KEY = 'xiaoy-cal-v1';
const store = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch{ return {} } })();
store.todos = store.todos || {};   // { 'YYYY-MM-DD': [{id,text,done}] }
store.theme = store.theme ?? 0;
store.fired = store.fired || {};   // { 'YYYY-MM-DD@8': true }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(store)) }catch{} };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const keyOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const WEEK = ['日','一','二','三','四','五','六'];

let view = new Date(); view.setDate(1);
let openKey = null;

/* 主题色 */
function applyTheme(){
  document.documentElement.style.setProperty('--theme', THEMES[store.theme].c);
  document.querySelectorAll('.dot').forEach((b,i)=>b.setAttribute('aria-pressed', i===store.theme));
}
THEMES.forEach((t,i)=>{
  const b = document.createElement('button');
  b.className='dot'; b.style.background=t.c; b.title=t.name; b.setAttribute('aria-label',t.name);
  b.onclick=()=>{ store.theme=i; save(); applyTheme(); };
  $('themes').appendChild(b);
});

/* 月视图 */
const pending = k => (store.todos[k]||[]).filter(t=>!t.done).length;

function render(){
  const y = view.getFullYear(), m = view.getMonth();
  $('title').textContent = `${y} 年 ${m+1} 月`;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const now = new Date(), todayKey = keyOf(now.getFullYear(),now.getMonth(),now.getDate());
  const total = Math.ceil((first+days)/7)*7;
  const grid = $('grid'); grid.innerHTML='';
  let row;
  for(let i=0;i<total;i++){
    if(i%7===0){ row=document.createElement('div'); row.className='row'; grid.appendChild(row); }
    const d = i-first+1;
    const cell = document.createElement(d>=1&&d<=days ? 'button' : 'div');
    cell.className='cell';
    if(d<1||d>days){ cell.classList.add('empty'); row.appendChild(cell); continue; }
    const k = keyOf(y,m,d), n = pending(k);
    if(k===todayKey) cell.classList.add('today');
    if(n>0) cell.classList.add('has');
    cell.innerHTML = `<span class="num">${d}</span>` + (n>0?`<span class="count">${n} 项</span>`:'');
    cell.setAttribute('aria-label', `${m+1}月${d}日，${n?n+'项待办':'无待办'}`);
    cell.onclick=()=>openDay(k);
    row.appendChild(cell);
  }
}

/* 当日详情 */
function openDay(k){
  openKey=k;
  const [y,m,d]=k.split('-').map(Number);
  $('dayTitle').textContent = `${m}月${d}日 · 周${WEEK[new Date(y,m-1,d).getDay()]}`;
  renderList();
  $('mask').classList.add('show');
  $('addInput').focus();
}
function renderList(){
  const arr = store.todos[openKey]||[];
  const n = arr.filter(t=>!t.done).length;
  $('daySub').textContent = arr.length ? `${n} 项待办 / 共 ${arr.length} 项` : '这天还没有待办';
  const ul=$('list'); ul.innerHTML='';
  if(!arr.length){ ul.innerHTML='<li class="emptytip" style="border:none">空空的，写点什么吧 ✏️</li>'; return; }
  arr.forEach(t=>{
    const li=document.createElement('li'); if(t.done) li.classList.add('done');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=t.done;
    cb.onchange=()=>{ t.done=cb.checked; save(); renderList(); render(); };
    const sp=document.createElement('span'); sp.className='txt'; sp.textContent=t.text;
    const del=document.createElement('button'); del.className='del'; del.textContent='🗑'; del.title='删除';
    del.onclick=()=>{ store.todos[openKey]=arr.filter(x=>x!==t); if(!store.todos[openKey].length) delete store.todos[openKey]; save(); renderList(); render(); };
    li.append(cb,sp,del); ul.appendChild(li);
  });
}
function closeDay(){ $('mask').classList.remove('show'); openKey=null; }
$('addForm').onsubmit=e=>{
  e.preventDefault();
  const v=$('addInput').value.trim(); if(!v) return;
  (store.todos[openKey] ||= []).push({id:Date.now(),text:v,done:false});
  $('addInput').value=''; save(); renderList(); render();
};
$('closeBtn').onclick=closeDay;
$('mask').onclick=e=>{ if(e.target.id==='mask') closeDay(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDay(); });

$('prev').onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
$('next').onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
$('todayBtn').onclick=()=>{ view=new Date(); view.setDate(1); render(); };

/* 提醒：当天 8:00 和 12:00 各一次 */
const SLOTS=[8,12];
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),8000);
}
function notify(title, body){
  toast(`${title}：${body}`);
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title,{body, tag:'xiaoy-'+Date.now()}); }catch{}
  }
}
function checkRemind(){
  const now=new Date(), h=now.getHours();
  const k=keyOf(now.getFullYear(),now.getMonth(),now.getDate());
  for(const s of SLOTS){
    const id=`${k}@${s}`;
    if(h===s && !store.fired[id]){        // 在 8 点档 / 12 点档内触发一次
      store.fired[id]=true;
      // 清理 7 天前的记录
      Object.keys(store.fired).forEach(x=>{ if(x.split('@')[0] < keyOf(now.getFullYear(),now.getMonth(),now.getDate()-7)) delete store.fired[x]; });
      save();
      const todo=(store.todos[k]||[]).filter(t=>!t.done);
      if(todo.length){
        notify(`小Y日历 · ${s}:00 提醒`, `今天还有 ${todo.length} 项待办：${todo.map(t=>t.text).join('、')}`);
      }
    }
  }
}
function updateNotifyUI(){
  const b=$('enableNotify');
  if(!('Notification' in window)){ b.style.display='none'; $('remindStatus').textContent='提醒：每天 8:00 和 12:00（此浏览器不支持系统通知，将在页面内弹出）'; return; }
  if(Notification.permission==='granted'){ b.style.display='none'; $('remindStatus').textContent='✅ 已开启：每天 8:00 和 12:00 提醒当天待办（需保持此页面打开）'; }
  else if(Notification.permission==='denied'){ b.style.display='none'; $('remindStatus').textContent='通知被浏览器拦截了，可在地址栏的网站设置里允许；页面内仍会弹出提醒'; }
}
$('enableNotify').onclick=async()=>{
  try{ await Notification.requestPermission(); }catch{}
  updateNotifyUI();
  if(Notification.permission==='granted') notify('小Y日历','通知已开启，8:00 和 12:00 见～');
};

applyTheme(); render(); updateNotifyUI(); checkRemind();
setInterval(()=>{ checkRemind(); }, 30*1000);
// 跨天自动刷新“今天”高亮
let lastDay=new Date().getDate();
setInterval(()=>{ const d=new Date().getDate(); if(d!==lastDay){ lastDay=d; render(); } }, 60*1000);
</script>
</body>
</html>
